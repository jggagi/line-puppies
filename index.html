<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>线条小狗的恋爱日记 — Couple Puppies' Love Simulator 🐶🐩</title>
  <meta name="description" content="A cozy virtual couple simulator for the famous internet Line Puppies (小白 & 小黄). Watch them live, swim, stargaze, and care for each other!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:    #ff85a1;
      --pink-lt: #ffd6e0;
      --pink-dk: #e05a7a;
      --lavender:#b5a4e8;
      --lav-lt:  #e8e2ff;
      --mint:    #7ed8c4;
      --peach:   #ffb38a;
      --cream:   #fff8f0;
      --brown:   #5c3a2e;
      --bg:      #0e081e;
      --bg2:     #190e32;
      --glass:   rgba(255,255,255,0.07);
      --glass-b: rgba(255,255,255,0.15);
      --text:    #f8e8ff;
      --text-sub:#c4aee0;
      --shadow:  0 8px 32px rgba(0,0,0,0.5);
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      padding-bottom: 40px;
    }

    /* ── Starfield background ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(181,164,232,0.18) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 70%, rgba(255,133,161,0.15) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 50%, rgba(25,14,50,1) 0%, rgba(14,8,30,1) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--dur,3s) ease-in-out infinite var(--delay,0s);
    }
    @keyframes twinkle {
      0%,100% { opacity: 0.15; transform: scale(1); }
      50%      { opacity: 0.9;  transform: scale(1.3); }
    }

    /* ── Layout ── */
    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      gap: 20px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
    }
    .header h1 {
      font-size: 2.2rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--pink) 0%, var(--lavender) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }
    .header .subtitle {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* ── Life Stage (Polaroid Card) ── */
    .dog-stage {
      width: 100%;
      background: #ffffff; /* Matches original white background of Line Puppies */
      border-radius: 28px;
      padding: 24px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow), inset 0 2px 8px rgba(255,255,255,0.8);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      color: #333333;
      transition: background 0.5s ease;
    }
    
    /* Subtle hover shimmer */
    .dog-stage::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(0,0,0,0.02) 0%, transparent 60%);
      pointer-events: none;
      transition: opacity 0.3s;
    }

    /* ── Status Banner (Activity Badge) ── */
    .status-banner {
      font-size: 1rem;
      font-weight: 800;
      padding: 6px 18px;
      border-radius: 99px;
      background: linear-gradient(135deg, var(--pink-dk), var(--lavender));
      color: white;
      box-shadow: 0 4px 14px rgba(255,133,161,0.3);
      letter-spacing: 0.5px;
      transition: all 0.4s ease;
      text-align: center;
      z-index: 5;
    }

    /* ── Puppy Wrapper ── */
    .dog-wrap {
      position: relative;
      width: 100%;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Cozy room background for idle/daily life */
    .room-bg {
      position: absolute;
      inset: -10px;
      background: radial-gradient(circle, rgba(255,248,240,0.8) 0%, rgba(255,255,255,1) 100%);
      opacity: 1;
      transition: opacity 0.5s;
      z-index: 1;
    }

    /* Dual idle view */
    .idle-dogs {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 16px;
      width: 100%;
      height: 100%;
      z-index: 2;
    }
    .dog-img {
      height: 145px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.06));
      transform-origin: bottom center;
    }
    .dog-img.white-dog {
      animation: white-idle 4.2s ease-in-out infinite;
    }
    .dog-img.brown-dog {
      animation: brown-idle 3.8s ease-in-out infinite;
    }
    @keyframes white-idle {
      0%,100% { transform: translateY(0px) rotate(0deg); }
      25%      { transform: translateY(-5px) rotate(-1deg); }
      75%      { transform: translateY(-2px) rotate(1deg); }
    }
    @keyframes brown-idle {
      0%,100% { transform: translateY(0px) rotate(0deg); }
      30%      { transform: translateY(-4px) rotate(1deg); }
      70%      { transform: translateY(-2px) rotate(-1deg); }
    }
    
    .idle-dogs.wiggling .white-dog { animation: wiggle 0.4s ease-in-out infinite; }
    .idle-dogs.wiggling .brown-dog { animation: wiggle 0.45s ease-in-out infinite; }
    @keyframes wiggle {
      0%,100% { transform: scale(1) rotate(0deg); }
      25%     { transform: scale(1.05) rotate(-3deg); }
      75%     { transform: scale(1.05) rotate(3deg); }
    }

    /* Action full illustrations */
    .action-img {
      position: absolute;
      max-height: 195px;
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.08));
      z-index: 3;
      display: none;
      animation: action-pop 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes action-pop {
      from { transform: scale(0.92) translateY(8px); opacity: 0; }
      to   { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* Speech bubbles */
    .bubble {
      position: absolute;
      background: white;
      color: #333;
      font-size: 0.95rem;
      font-weight: 800;
      padding: 8px 12px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      border: 1px solid rgba(0,0,0,0.05);
      opacity: 0;
      transform: scale(0.5) translateY(10px);
      transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
      pointer-events: none;
      z-index: 10;
      white-space: nowrap;
    }
    .bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      width: 0; height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid white;
    }
    
    .bubble.white-bubble {
      left: 15px;
      top: -15px;
      border-bottom-left-radius: 2px;
    }
    .bubble.white-bubble::after { left: 14px; }
    
    .bubble.brown-bubble {
      right: 15px;
      top: -15px;
      border-bottom-right-radius: 2px;
    }
    .bubble.brown-bubble::after { right: 14px; }

    .bubble.show {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    /* Hearts / particles */
    .particle {
      position: absolute;
      font-size: 1.4rem;
      pointer-events: none;
      animation: particle-fly 1.2s ease-out forwards;
      z-index: 20;
    }
    @keyframes particle-fly {
      0%   { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx, 0px), var(--ty, -80px)) scale(0.4); }
    }

    /* ── Info Row ── */
    .love-info {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .love-card {
      flex: 1;
      background: var(--glass);
      border: 1px solid var(--glass-b);
      border-radius: 16px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(8px);
    }
    .love-avatar {
      font-size: 1.4rem;
      width: 36px;
      height: 36px;
      background: rgba(255,133,161,0.2);
      border: 2.2px solid var(--pink);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .love-name { font-size: 1.1rem; font-weight: 900; }
    .love-title { font-size: 0.72rem; color: var(--text-sub); margin-top: 1px; }

    .level-badge {
      background: linear-gradient(135deg, var(--lavender), var(--pink));
      border-radius: 14px;
      padding: 10px 16px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(181,164,232,0.3);
    }
    .level-num { font-size: 1.4rem; font-weight: 900; line-height: 1; }
    .level-txt { font-size: 0.65rem; font-weight: 700; color: rgba(255,255,255,0.85); text-transform: uppercase; }

    /* ── Progress Bar ── */
    .progress-section {
      width: 100%;
      background: var(--glass);
      border: 1px solid var(--glass-b);
      border-radius: 18px;
      padding: 12px 16px;
      backdrop-filter: blur(8px);
    }
    .progress-label-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .progress-lbl {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-sub);
      letter-spacing: 0.5px;
    }
    .progress-val {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--pink);
    }
    .bar-wrap {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.10);
      border-radius: 99px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--pink), var(--pink-dk));
      border-radius: 99px;
      transition: width 0.5s ease;
    }

    /* ── Mode selector / Actions ── */
    .controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .mode-toggle-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--glass-b);
      border-radius: 14px;
      padding: 8px 14px;
    }
    .mode-label { font-size: 0.85rem; font-weight: 700; color: var(--text-sub); }
    .switch-btn {
      background: var(--glass);
      border: 1.5px solid var(--glass-b);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .switch-btn.active {
      background: var(--pink);
      border-color: var(--pink);
      color: white;
      box-shadow: 0 2px 8px rgba(255,133,161,0.3);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 8px;
    }
    
    .action-btn {
      background: var(--glass);
      border: 1px solid var(--glass-b);
      border-radius: 16px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      color: var(--text);
      font-size: 0.75rem;
      font-weight: 700;
      transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
      backdrop-filter: blur(8px);
    }
    .action-btn:hover {
      transform: translateY(-3px) scale(1.03);
      background: rgba(255,255,255,0.13);
      border-color: rgba(255,255,255,0.3);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }
    .action-btn:active { transform: scale(0.96); }
    .action-btn .btn-icon { font-size: 1.6rem; line-height: 1; }
    .action-btn.active {
      background: rgba(255,133,161,0.15);
      border-color: var(--pink);
      box-shadow: 0 0 10px rgba(255,133,161,0.25);
    }

    /* ── Achievements ── */
    .achievements {
      width: 100%;
      background: var(--glass);
      border: 1px solid var(--glass-b);
      border-radius: 20px;
      padding: 16px;
      backdrop-filter: blur(8px);
    }
    .achievements h2 {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-sub);
      margin-bottom: 12px;
    }
    .achievement-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .achievement {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s;
    }
    .achievement.unlocked {
      background: rgba(255,133,161,0.15);
      border-color: rgba(255,133,161,0.4);
    }
    .achievement.locked { opacity: 0.35; }

    /* ── Diary Log ── */
    .diary-panel {
      width: 100%;
      background: var(--glass);
      border: 1px solid var(--glass-b);
      border-radius: 20px;
      padding: 16px;
      backdrop-filter: blur(8px);
      max-height: 160px;
      overflow-y: auto;
    }
    .diary-panel h2 {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-sub);
      margin-bottom: 8px;
    }
    .diary-entry {
      font-size: 0.82rem;
      color: var(--text-sub);
      padding: 5px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      animation: log-in 0.3s ease;
      line-height: 1.4;
    }
    @keyframes log-in {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .diary-entry .time { color: rgba(255,255,255,0.3); font-size: 0.7rem; margin-right: 6px; font-weight: 700; }
    .diary-panel::-webkit-scrollbar { width: 4px; }
    .diary-panel::-webkit-scrollbar-track { background: transparent; }
    .diary-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

    /* ── Name modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10,0,20,0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fade-in 0.3s ease;
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      background: linear-gradient(135deg, #231640, #160d2d);
      border: 1px solid rgba(255,133,161,0.3);
      border-radius: 28px;
      padding: 36px 32px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
      animation: modal-in 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes modal-in {
      from { opacity: 0; transform: scale(0.8) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal .modal-badge {
      font-size: 3.5rem;
      margin-bottom: 12px;
      animation: white-idle 3s ease-in-out infinite;
    }
    .modal h2 { font-size: 1.6rem; font-weight: 900; margin-bottom: 6px; }
    .modal p { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 20px; }

    .modal input {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(255,133,161,0.4);
      border-radius: 12px;
      padding: 12px 16px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      outline: none;
      text-align: center;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }
    .modal input:focus { border-color: var(--pink); }
    .modal input::placeholder { color: rgba(255,255,255,0.3); }
    .modal button {
      width: 100%;
      background: linear-gradient(135deg, var(--pink-dk), var(--lavender));
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      color: white;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
      box-shadow: 0 4px 16px rgba(255,133,161,0.35);
    }
    .modal button:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 8px 24px rgba(255,133,161,0.5); }

    /* ── Toast notifications ── */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: linear-gradient(135deg, #2a1545, var(--bg2));
      border: 1px solid rgba(255,133,161,0.4);
      border-radius: 14px;
      padding: 12px 18px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
      box-shadow: var(--shadow);
      animation: toast-in 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }
    .toast.out { animation: toast-out 0.3s ease forwards; }
    @keyframes toast-in  { from { opacity:0; transform:translateX(40px); } to { opacity:1; transform:translateX(0); } }
    @keyframes toast-out { from { opacity:1; transform:translateX(0); }    to { opacity:0; transform:translateX(40px); } }
  </style>
</head>
<body>

<!-- Stars -->
<div class="stars" id="stars"></div>

<!-- Name modal -->
<div class="modal-overlay" id="nameModal">
  <div class="modal">
    <div class="modal-badge">🐶❤️🐩</div>
    <h2>线条小狗的恋爱日常</h2>
    <p>Give your virtual couple puppies home a name:</p>
    
    <input type="text" id="nameInput" placeholder="e.g. Line Puppies, Sweet House..." maxlength="20" />
    <button id="nameBtn">Enter Love World! 💕</button>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<div class="app">
  <div class="header">
    <h1>🐾 线条小狗</h1>
    <p class="subtitle">Couple Puppies' Love & Life Simulator</p>
  </div>

  <!-- Stage -->
  <div class="dog-stage" id="dogStage">
    <div class="status-banner" id="statusBanner">🏡 日常贴贴</div>

    <div class="dog-wrap" id="dogWrap">
      <div class="room-bg" id="roomBg"></div>
      <div class="dog-halo"></div>

// ── DOM refs ───────────────────────────────────────────
const dogWhite         = document.getElementById('dogWhite');

// ── Mouse shimmer ──────────────────────────────────────
dogStage.addEventListener('mousemove', e => {
  const r = dogStage.getBoundingClientRect();
  dogStage.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
  dogStage.style.setProperty('--my', ((e.clientY - r.top)  / r.height * 100) + '%');
});

// Click stage = wiggle
dogStage.addEventListener('click', e => {
  if (e.target.closest('.bubble')) return;
  
  if (state.currentActivity === 'home') {
    idleDogs.classList.remove('wiggling');

    idleDogs.classList.add('wiggling');

// ── Activity Controls ──────────────────────────────────
function applyActivityView(activity) {
  state.currentActivity = activity;
  
  // Reset all displays
  idleDogs.style.display = 'none';
  actionStargazing.style.display = 'none';
  actionSwimming.style.display = 'none';
  actionSick.style.display = 'none';
  roomBg.style.opacity = '0';
  dogStage.style.background = '#ffffff'; // default
  
  // Highlight active button
  document.querySelectorAll('.btn-grid .action-btn').forEach(btn => btn.classList.remove('active'));

  switch(activity) {
    case 'home':
      idleDogs.style.display = 'flex';
      roomBg.style.opacity = '1';
      statusBanner.textContent = '🏡 日常贴贴';
      statusBanner.style.background = 'linear-gradient(135deg, var(--peach), var(--pink))';
      document.getElementById('btnHome').classList.add('active');
      break;
    case 'swim':
      actionSwimming.style.display = 'block';
      statusBanner.textContent = '🏖️ 夏日戏水';
      statusBanner.style.background = 'linear-gradient(135deg, #0ea5e9, #38bdf8)';
      dogStage.style.background = '#e0f2fe'; // soft blue-sea
      document.getElementById('btnSwim').classList.add('active');
      break;
    case 'stargazing':
      actionStargazing.style.display = 'block';

      statusBanner.style.background = 'linear-gradient(135deg, #ef4444, #f87171)';
      dogStage.style.background = '#fef2f2'; // warm red care
      document.getElementById('btnSick').classList.add('active');
      break;
  }
}

window.triggerActivity = function(activity, isAuto = false) {
  if (state.currentActivity === activity && !isAuto) return;
  
  state.interactions[activity]++;
  applyActivityView(activity);
  
  // Log entry in diary
  const prefix = isAuto ? '【偶遇日常】' : '【特别安排】';
  let desc = '';
  switch(activity) {
    case 'home':
      desc = `小白和小黄回到了温馨的家里，在毛毯上快乐地贴贴，小尾巴摇得飞快 🐾`;
      break;
    case 'swim':
      desc = `今天天气真热，小狗们带上冰可乐去海边游泳啦，漂浮在黄色游泳圈上真惬意 🌊`;
      break;
    case 'stargazing':
      desc = `天黑了，小狗们手牵手来到山顶躺在草地上看星空，天空划过了几颗闪闪的流星 🌠`;
      break;
    case 'sick':
      desc = `夜里风大，小白不小心感冒发烧了，小黄心疼坏了，赶紧送来热汤 and 厚被子照料它 ☕`;
      break;
  }
  addLog(`${prefix}${desc}`);
  
  // Speak dialogue immediately
  triggerSweetTalk();
  checkAchievements();
  saveState();
};

// ── Sweet Interactions ──────────────────────────────────
window.triggerSweetAction = function(type) {
  const rect = dogStage.getBoundingClientRect();
  const center_x = rect.left + rect.width / 2;
  const center_y = rect.top + rect.height / 2;

  if (type === 'love') {
    state.interactions.love++;
    gainIntimacy(5);
    spawnParticles(center_x, center_y, ['❤️','💖','💕','✨'], 10);
    showToast('❤️ 你送出了一捧大大的爱心！两只小狗快乐度上升！');
    
    // Quick dialogue
    showSpeech('whiteBubble', '收到爱心啦！汪 🐩');
    setTimeout(() => showSpeech('brownBubble', '嘿嘿，谢谢你哦！🦮'), 800);
    
    addLog(`【爱心投喂】你向小狗们抛出了一颗红红的爱心，两只小狗高兴极了 💖`);
  } else if (type === 'talk') {
    state.interactions.talk++;
    triggerSweetTalk();
    spawnParticles(center_x, center_y, ['💬','✨','🐾'], 4);
  }
  checkAchievements();
  saveState();
};

function showSpeech(bubbleId, text) {
  const bub = document.getElementById(bubbleId);
  bub.textContent = text;
  bub.classList.add('show');
  clearTimeout(bub._t);
  bub._t = setTimeout(() => bub.classList.remove('show'), 2800);
}

function triggerSweetTalk() {
  const list = DIALOGUES[state.currentActivity];
  const pair = list[Math.floor(Math.random() * list.length)];
  
  // Show white puppy dialogue first, then brown puppy responds
  showSpeech('whiteBubble', pair[0]);
  setTimeout(() => {
    showSpeech('brownBubble', pair[1]);
  }, 1200);
}

// ── Intimacy & Leveling ──────────────────────────────────
function gainIntimacy(amount) {
  state.loveProgress += amount;
  updateLoveProgress();
}

function updateLoveProgress() {
  const needed = state.level * 50;
  if (state.loveProgress >= needed) {
    state.loveProgress -= needed;
    state.level++;
    levelNum.textContent = state.level;
    
    const titleEntry = [...TITLES].reverse().find(([l]) => state.level >= l);
    displayLoveTitle.textContent = titleEntry ? titleEntry[1] : TITLES.at(-1)[1];
    
    showToast(`🎉 亲密度升级！当前恋爱等级达到 Level ${state.level}!`);
    
    // Particle burst
    spawnParticles(window.innerWidth/2, window.innerHeight/2, ['💖','🎉','🌟','💫'], 15);
    addLog(`【关系升温】小白与小黄的默契度提升！达到了【${displayLoveTitle.textContent}】阶段！💍`);
  }
  
  loveProgressText.textContent = `${state.loveProgress} / ${needed}`;
  loveBar.style.width = (state.loveProgress / needed * 100) + '%';
  saveState();
}

function checkAchievements() {
  ACHIEVEMENTS.forEach(a => {
    if (!state.achievements[a.id] && a.check(state)) {
      state.achievements[a.id] = true;
      showToast(`🏆 达成纪念时刻: ${a.icon} ${a.label}!`);
      renderAchievements();
    }
  });
}

function renderAchievements() {
  achList.innerHTML = '';
  ACHIEVEMENTS.forEach(a => {
    const el = document.createElement('div');
    const unlocked = !!state.achievements[a.id];
    el.className = 'achievement ' + (unlocked ? 'unlocked' : 'locked');
    el.textContent = `${a.icon} ${a.label}`;
    el.title = unlocked ? 'Unlocked!' : 'Locked';
    achList.appendChild(el);
  });
}

// ── Cycle Control ──────────────────────────────────────
window.setCycleMode = function(mode) {
  state.cycleMode = mode;
  document.getElementById('btnSimSpeed').classList.toggle('active', mode === 'sim');
  document.getElementById('btnRealtime').classList.toggle('active', mode === 'real');
  
  showToast(`⏰ 周期模式已切换为：${mode === 'sim' ? '快速模拟 (Fast-Sim)' : '系统实时时间 (Real-time)'}`);
  
  // Restart timer
  initCycleTimer();
  saveState();
};

function initCycleTimer() {
  clearInterval(state.activityTimer);
  
  if (state.cycleMode === 'sim') {
    // Fast-sim cycle: change activity every 25 seconds
    const list = ['home', 'swim', 'stargazing', 'sick'];
    state.activityTimer = setInterval(() => {
      let currentIdx = list.indexOf(state.currentActivity);
      let nextIdx = (currentIdx + 1) % list.length;
      triggerActivity(list[nextIdx], true);
      gainIntimacy(2); // passive love points over time
    }, 25000);
  } else {
    // Realtime cycle: depends on actual computer local hours
    checkRealtimeActivity();
    state.activityTimer = setInterval(() => {
      checkRealtimeActivity();
    }, 60000); // Check every minute
  }
}

function checkRealtimeActivity() {
  const hr = new Date().getHours();
  let nextAct = 'home';
  
  if (hr >= 7 && hr < 12) {
    nextAct = 'home'; // Morning cozy home
  } else if (hr >= 12 && hr < 17) {
    nextAct = 'swim'; // Afternoon sunny sea swim
  } else if (hr >= 17 && hr < 22) {
    nextAct = 'stargazing'; // Evening stargazing
  } else {
    nextAct = 'sick'; // Night cold/care
  }
  
  if (state.currentActivity !== nextAct) {
    triggerActivity(nextAct, true);
  }
}

function addLog(msg) {
  const now = new Date();
  const t = now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});
  const el = document.createElement('div');
  el.className = 'diary-entry';
  el.innerHTML = `<span class="time">${t}</span>${msg}`;
  diaryList.prepend(el);
  if (diaryList.children.length > 40) diaryList.lastChild.remove();
}

function spawnParticles(x, y, emojis, count=5) {
  for (let i=0; i<count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const tx = (Math.random()-0.5)*80;
    const ty = -(40 + Math.random()*60);
    p.style.cssText=`left:${x}px;top:${y}px;position:fixed;--tx:${tx}px;--ty:${ty}px;animation-delay:${Math.random()*0.2}s`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 1400);
  }
}

// ── Persistence (LocalStorage) ─────────────────────────
function saveState() {
  localStorage.setItem('line_puppies_state', JSON.stringify({
    name: state.name,
    loveProgress: state.loveProgress,
    level: state.level,
    interactions: state.interactions,
    achievements: state.achievements,
    cycleMode: state.cycleMode,
    currentActivity: state.currentActivity
  }));
  
  const logs = [];
  document.querySelectorAll('.diary-entry').forEach(el => {
    logs.push(el.innerHTML);
  });
  localStorage.setItem('line_puppies_diary', JSON.stringify(logs));
}

function loadState() {
  const saved = localStorage.getItem('line_puppies_state');
  if (saved) {
    try {
      const data = JSON.parse(saved);
      state.name = data.name || 'Line Puppies';
      state.loveProgress = data.loveProgress || 0;
      state.level = data.level || 1;
      state.interactions = data.interactions || state.interactions;
      state.achievements = data.achievements || {};
      state.cycleMode = data.cycleMode || 'sim';
      state.currentActivity = data.currentActivity || 'home';
      
      displayHomeName.textContent = state.name;
      document.getElementById('nameModal').style.display = 'none';
      
      applyActivityView(state.currentActivity);
      initCycleTimer();
      updateLoveProgress();
      renderAchievements();
    } catch(e) {
      console.error("Error loading state", e);
    }
  } else {
    return false;
  }
  
  const savedDiary = localStorage.getItem('line_puppies_diary');
  if (savedDiary) {
    try {
      const logs = JSON.parse(savedDiary);
      diaryList.innerHTML = '';
      logs.forEach(logText => {
        const el = document.createElement('div');
        el.className = 'diary-entry';
        el.innerHTML = logText;
        diaryList.appendChild(el);
      });
    } catch(e) {
      console.error("Error loading diary", e);
    }
  }
  return true;
}
